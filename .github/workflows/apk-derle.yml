name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK olustur
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: IDM-Uzaktan-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: APK'yi Surumler (Releases) sayfasina koy
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk IDM-Uzaktan.apk
          TAG="v1.0.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" IDM-Uzaktan.apk \
            --title "IDM Uzaktan (derleme ${GITHUB_RUN_NUMBER})" \
            --notes "Telefona kurmak icin asagidaki IDM-Uzaktan.apk dosyasina dokunun." \
            --latest
